<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splunk Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M10 10l8 6-8 6' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 22h5' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeos
    try { const t = localStorage.getItem('sm.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/overview">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M10 10l8 6-8 6" /><path d="M18 22h5" /></svg>
        </span>
        <span class="brand-text">Splunk Manager<small>SIRT</small></span>
      </a>
      <nav id="nav" class="nav" aria-label="Secciones"></nav>
      <div class="sidebar-footer">
        <button class="nav-item" id="theme-toggle" type="button"></button>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-icon btn-ghost menu-btn" id="menu-btn" type="button" aria-label="Abrir menú"></button>
        <div class="client-switcher" id="client-switcher"></div>
        <div class="topbar-spacer"></div>
        <button class="btn btn-ghost tasks-btn" id="tasks-btn" type="button"></button>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
